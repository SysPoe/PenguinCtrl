<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CuSus Cue List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/cue.css">
</head>

<body>
  <div class="cue-error-toasts" id="cue-error-toasts"></div>

  <div id="ws-banner">
    WebSocket Disconnected - Reconnecting...
  </div>

  <header class="header app-header">
    <div class="header-left">
      <strong class="app-title">Cue List</strong>
      <span class="header-count" id="cue-count">-</span>
      <span class="ws-dot" id="ws-dot" title="WebSocket status"></span>
    </div>
    <nav class="header-actions" aria-label="Cue list actions">
      <button class="header-btn" id="btn-new-cue" type="button">New Cue</button>
      <button class="header-btn" id="btn-edit-cue" type="button" disabled>Edit</button>
      <button class="btn-reset" id="btn-reset-played" type="button" title="Clear all tick marks">Reset</button>
      <button class="header-btn" id="btn-refresh" type="button">Refresh</button>
      <a class="header-btn link-btn" href="settings.html">Settings</a>
    </nav>
  </header>

  <section class="pane-top" id="pane-top" style="height: 56vh;" aria-label="Cues">
    <div class="cue-table-wrap">
      <table id="cue-table">
        <thead>
          <tr>
            <th class="col-num">#</th>
            <th>Title</th>
            <th class="col-type">Type</th>
            <th class="col-state">State</th>
            <th class="col-position">Position</th>
            <th class="col-len r">Length</th>
          </tr>
        </thead>
        <tbody id="cue-tbody"></tbody>
      </table>
      <div class="empty-cues" id="empty-cues" hidden>No cues defined</div>
    </div>
  </section>

  <div class="resizer" id="resizer" role="separator" aria-orientation="horizontal" aria-label="Resize panes"></div>

  <section class="pane-bottom" aria-label="Runtime controls">
    <div class="transport">
      <div class="master-vol-row">
        <div class="master-vol-top">
          <div class="master-vol-label">Master Vol <span id="master-db-label">+0.0 dB</span></div>
          <button class="header-btn btn-master-mute" id="master-mute-btn" type="button">Mute</button>
        </div>
        <input type="range" id="master-vol" min="-40" max="6" step="0.5" value="0" aria-label="Master volume">
      </div>
      <div class="transport-btns">
        <button class="btn-transport btn-go" id="btn-go" type="button" disabled>GO</button>
        <button class="btn-transport btn-fade" id="btn-fade-all" type="button">Fade All</button>
        <button class="btn-transport btn-stop" id="btn-stop-all" type="button">Stop All</button>
      </div>
    </div>

    <div class="voices-panel">
      <div class="voices-header">
        <span id="voices-header-label">Active Voices</span>
        <button class="header-btn voices-clear-btn" id="btn-clear-queue" type="button" title="Cancel any queued waiting cues">Clear Queue</button>
      </div>
      <div id="voices-list">
        <div class="no-voices">No active voices</div>
      </div>
    </div>
  </section>

  <dialog class="cue-editor" id="cue-editor">
    <form id="cue-editor-form" method="dialog">
      <div class="editor-header">
        <div>
          <h2 id="editor-title">New Cue</h2>
          <p id="editor-subtitle">Create a cue directly in the list.</p>
        </div>
        <button class="icon-btn" id="btn-close-editor" type="button" aria-label="Close editor">x</button>
      </div>

      <div class="editor-grid">
        <label>
          Cue Number
          <input id="field-cue-number" name="number" type="text" autocomplete="off" placeholder="10.01">
        </label>
        <label>
          Type
          <select id="field-cue-type" name="cueType"></select>
        </label>
        <label class="span-2">
          Title
          <input id="field-title" name="title" type="text" autocomplete="off" required placeholder="Cue title">
        </label>
        <label class="span-2">
          Notes
          <textarea id="field-description" name="description" rows="2" placeholder="Optional notes"></textarea>
        </label>
      </div>

      <section class="editor-section" id="lighting-editor" hidden>
        <h3>Lighting</h3>
        <div class="editor-grid">
          <label>
            Action
            <select id="field-lighting-action">
              <option value="none">None</option>
              <option value="go">Go</option>
              <option value="back">Back</option>
              <option value="release">Release</option>
              <option value="goto">Go To Cue</option>
              <option value="level">Set Level</option>
              <option value="flash">Flash</option>
            </select>
          </label>
          <label>
            Transport
            <select id="field-lighting-transport">
              <option value="auto">Auto</option>
              <option value="osc">OSC</option>
              <option value="remote">QuickQ Remote UDP</option>
            </select>
          </label>
          <label>
            Playback
            <input id="field-lighting-playback" type="number" min="1" step="1" value="1">
          </label>
          <label>
            Console Cue
            <input id="field-lighting-cue" type="text" value="{cueNumber}" placeholder="{cueNumber+0.01}">
          </label>
          <label>
            Level
            <input id="field-lighting-level" type="number" min="0" max="100" step="1" value="100">
          </label>
        </div>
      </section>

      <section class="editor-section" id="sound-editor" hidden>
        <h3>Sound</h3>
        <div class="editor-grid">
          <label>
            Clip
            <select id="field-sound-clip"></select>
          </label>
          <label class="upload-label">
            Upload
            <input id="field-sound-upload" type="file" accept="audio/*">
          </label>
          <label>
            Subtype
            <select id="field-sound-subtype">
              <option value="play_once">Play Once</option>
              <option value="vamp">Vamp</option>
            </select>
          </label>
          <label>
            Play Style
            <select id="field-sound-play-style">
              <option value="alongside">Alongside</option>
              <option value="wait">Wait</option>
              <option value="fade_all">Fade all</option>
              <option value="xfade">X-Fade</option>
            </select>
          </label>
          <label>
            Start
            <input id="field-clip-start" type="number" min="0" step="0.001" value="0">
          </label>
          <label>
            End
            <input id="field-clip-end" type="number" min="0" step="0.001" placeholder="Auto">
          </label>
          <label>
            Fade In
            <input id="field-fade-in" type="number" min="0" step="0.001" value="0">
          </label>
          <label>
            Fade Out
            <input id="field-fade-out" type="number" min="0" step="0.001" value="0">
          </label>
          <label>
            Manual Fade
            <input id="field-manual-fade" type="number" min="0.1" step="0.1" value="2">
          </label>
          <label>
            Volume dB
            <input id="field-volume" type="number" min="-40" max="20" step="0.5" value="0">
          </label>
          <label>
            Loop Start
            <input id="field-loop-start" type="number" min="0" step="0.001" value="0">
          </label>
          <label>
            Loop End
            <input id="field-loop-end" type="number" min="0" step="0.001" placeholder="Auto">
          </label>
          <label>
            Loop X-Fade
            <input id="field-loop-xfade" type="number" min="0" step="0.001" value="0">
          </label>
          <label class="toggle-field">
            <input id="field-allow-multiple" type="checkbox">
            <span>Allow multiple instances</span>
          </label>
        </div>

        <h3>Start OSC</h3>
        <div class="editor-grid">
          <label>
            Action
            <select id="field-start-osc-action">
              <option value="none">None</option>
              <option value="go">Go</option>
              <option value="back">Back</option>
              <option value="release">Release</option>
              <option value="goto">Go To Cue</option>
              <option value="level">Set Level</option>
              <option value="flash">Flash</option>
            </select>
          </label>
          <label>
            Transport
            <select id="field-start-osc-transport">
              <option value="auto">Auto</option>
              <option value="osc">OSC</option>
              <option value="remote">QuickQ Remote UDP</option>
            </select>
          </label>
          <label>
            Playback
            <input id="field-start-osc-playback" type="number" min="1" step="1" value="1">
          </label>
          <label>
            Console Cue
            <input id="field-start-osc-cue" type="text" value="{cueNumber}" placeholder="{cueNumber+0.01}">
          </label>
          <label>
            Level
            <input id="field-start-osc-level" type="number" min="0" max="100" step="1" value="100">
          </label>
        </div>
      </section>

      <div class="editor-actions">
        <button class="btn-vc stop" id="btn-delete-cue" type="button" hidden>Delete</button>
        <span class="editor-spacer"></span>
        <button class="header-btn" id="btn-cancel-editor" type="button">Cancel</button>
        <button class="header-btn primary-action" id="btn-save-cue" type="submit">Save Cue</button>
      </div>
    </form>
  </dialog>

  <script src="scripts/cue-app.js"></script>
</body>

</html>
