<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CuSus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/cue.css">
  <link rel="stylesheet" href="styles/cue-editor.css">
  <link rel="stylesheet" href="styles/cue-separation.css">
  <link rel="stylesheet" href="styles/app-support.css">
  <link rel="stylesheet" href="styles/timecode-wave.css">
</head>

<body>
  <div id="toasts" class="toasts"></div>
  <div id="status-banner" class="status-banner" hidden></div>
  <header class="topbar">
    <div class="brand">
      <strong>CuSus</strong>
      <span id="show-status">Edit mode</span>
      <span id="ws-dot" class="dot"></span>
    </div>
    <nav class="tools">
      <button id="btn-show-mode" type="button">Show Mode</button>
      <button id="btn-new" type="button">New</button>
      <button id="btn-edit" type="button" disabled>Edit</button>
      <button id="btn-copy" type="button" disabled>Copy</button>
      <button id="btn-paste" type="button">Paste</button>
      <button id="btn-bump" type="button">Bump</button>
      <button id="btn-export" type="button">Export</button>
      <label class="file-btn">Import <input id="show-import" type="file" accept=".cusus"></label>
      <a href="settings.html">Settings</a>
    </nav>
  </header>

  <main class="workspace">
    <section class="cue-area">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Title</th>
            <th>Type</th>
            <th>Status</th>
            <th>Length</th>
          </tr>
        </thead>
        <tbody id="cue-body"></tbody>
      </table>
      <div id="empty" class="empty" hidden>No cues yet</div>
    </section>
    <aside class="sidecar">
      <div class="master">
        <label>Master <span id="master-label">+0.0 dB</span></label>
        <input id="master" type="range" min="-40" max="6" step="0.5" value="0">
        <button id="master-mute" type="button">Mute</button>
      </div>
      <button id="go" class="go" type="button" disabled>GO</button>
      <button id="fade-all" class="warn" type="button">Fade All</button>
      <button id="stop-all" class="danger" type="button">Stop All</button>
      <button id="reset-played" type="button">Reset Ticks</button>
      <div class="voices">
        <h2>Active Voices</h2>
        <div id="voices"></div>
      </div>
    </aside>
  </main>

  <dialog id="cue-editor" class="fullscreen">
    <form id="cue-form">
      <header>
        <h1 id="editor-heading">Cue</h1><button id="close-editor" type="button">Close</button>
      </header>
      <section class="form-grid">
        <label>Cue Number <input id="cue-number" autocomplete="off"></label>
        <label>Action Type <select id="cue-type"></select></label>
        <label class="wide">Title <input id="cue-title" required></label>
        <label class="wide">Notes <textarea id="cue-notes"></textarea></label>
      </section>
      <section id="actions-fields" class="panel">
        <h2>Actions</h2>
        <div class="cue-action-list" id="cue-action-list"></div>
        <div class="action-row">
          <button id="add-action" type="button">Add Action</button>
        </div>
      </section>
      <section id="sound-fields" class="panel">
        <h2>Sound</h2>
        <div class="form-grid">
          <label>Clip <select id="sound-clip"></select></label>
          <label>Upload <input id="sound-upload" type="file" accept="audio/*,video/*,.mp4,.mov,.m4v,.mkv,.avi"></label>
          <label>Subtype <select id="sound-subtype">
              <option value="play_once">Play Once</option>
              <option value="vamp">Vamp</option>
            </select></label>
          <label>Style <select id="play-style">
              <option value="alongside">Alongside</option>
              <option value="wait">Wait</option>
              <option value="fade_all">Fade All</option>
              <option value="xfade">Crossfade</option>
            </select></label>
          <label>Start <input id="clip-start" type="number" step="0.001" value="0"></label>
          <label>End <input id="clip-end" type="number" step="0.001"></label>
          <label>Fade In <input id="fade-in" type="number" step="0.001" value="0"></label>
          <label>Fade Out <input id="fade-out" type="number" step="0.001" value="0"></label>
          <label>Volume dB <input id="volume" type="number" step="0.5" value="0"></label>
          <label>Loop Start <input id="loop-start" type="number" step="0.001" value="0"></label>
          <label>Loop End <input id="loop-end" type="number" step="0.001"></label>
          <div class="wide action-row">
            <button id="open-timecode" type="button">Markers</button>
            <span id="sound-timecode-summary">No markers</span>
          </div>
        </div>
      </section>
      <section id="lighting-fields" class="panel">
        <h2>Lighting</h2>
        <div class="form-grid">
          <label>OSC Action <select id="osc-action">
              <option value="none">None</option>
              <option value="goto">Go To Cue</option>
              <option value="go">Go</option>
              <option value="back">Back</option>
              <option value="release">Release</option>
            </select></label>
          <label>Playback <input id="osc-playback" type="number" min="1" value="1"></label>
          <label>Console Cue <input id="osc-cue" value="{cueNumber}"></label>
          <label>Level <input id="osc-level" type="number" min="0" max="100" value="100"></label>
        </div>
      </section>
      <section id="modifier-fields" class="panel">
        <h2>Modifier</h2>
        <div class="form-grid">
          <label>Target Cue <select id="target-cue"></select></label>
          <label>Action <select id="modifier-action">
              <option value="fade">Fade Target</option>
              <option value="volume">Lerp Volume</option>
              <option value="stop">Stop Target</option>
            </select></label>
          <label data-modifier-field="duration">Duration <input id="modifier-duration" type="number" step="0.001"
              value="2"></label>
          <label data-modifier-field="volume">Target Volume dB <input id="target-volume" type="number" step="0.5"
              value="-12"></label>
        </div>
      </section>
      <footer><button id="delete-cue" class="danger" type="button">Delete</button><span></span><button type="button"
          id="cancel-editor">Cancel</button><button class="primary" type="submit">Save</button></footer>
    </form>
  </dialog>

  <dialog id="timecode-editor" class="fullscreen">
    <header>
      <h1>Sound Timecode</h1><button id="close-timecode" type="button">Close</button>
    </header>
    <section class="panel timecode-top-panel">
      <div class="timecode-grid layout-bands">
        <div class="timecode-cell clip-cell">
          <h2>Clip</h2>
          <label><span class="label-text">Start</span><input id="tc-clip-start" type="number" min="0" step="0.001"
              value="0"></label>
          <label><span class="label-text">End</span><input id="tc-clip-end" type="number" min="0" step="0.001"></label>
          <label><span class="label-text">In</span><input id="tc-fade-in" type="number" min="0" step="0.001"
              value="0"></label>
          <label><span class="label-text">Out</span><input id="tc-fade-out" type="number" min="0" step="0.001"
              value="0"></label>
        </div>
        <div class="timecode-cell marker-main">
          <h2>Marker</h2>
          <label><span class="label-text">At</span><input id="trigger-time" type="number" min="0" step="0.001"
              value="0"></label>
          <label><span class="label-text">Type</span><select id="trigger-kind">
              <option value="osc">Remote Action</option>
              <option value="cue_volume">Cue Volume</option>
              <option value="master_volume">Master Volume</option>
            </select></label>
        </div>
        <div class="timecode-cell remote-cell">
          <h2>Remote</h2>
          <label data-trigger-field="osc"><span class="label-text">Action</span><select id="trigger-action">
              <option value="none">No action</option>
              <option value="goto">Go To Cue</option>
              <option value="go">Go</option>
              <option value="back">Back</option>
              <option value="release">Release</option>
            </select></label>
          <label data-trigger-field="osc" data-action-dependent><span class="label-text">Playback</span><input
              id="trigger-playback" type="number" min="1" step="1" value="1"></label>
          <label data-trigger-field="osc" data-action-dependent><span class="label-text">Cue</span><input
              id="trigger-cue" value="{cueNumber}"></label>
          <label data-trigger-field="osc" data-action-dependent><span class="label-text">Transport</span><select
              id="trigger-transport">
              <option value="auto">Auto</option>
              <option value="osc">OSC</option>
              <option value="remote">Remote UDP</option>
            </select></label>
        </div>
        <div class="timecode-cell level-cell">
          <h2>Level</h2>
          <label data-trigger-field="local-level" class="check-label level-toggle">
            <span class="label-text">Set level</span><input id="trigger-set-level" type="checkbox">
          </label>
          <label data-trigger-field="local-level"><span class="label-text">Level dB</span><input id="trigger-level"
              type="number" step="0.5" value="0" disabled></label>
          <label data-trigger-field="fade"><span class="label-text">Fade</span><input id="trigger-fade" type="number"
              min="0" step="0.001" value="0"></label>
          <label data-trigger-field="volume"><span class="label-text">Volume dB</span><input id="trigger-volume"
              type="number" step="0.5" value="0"></label>
        </div>
        <div class="timecode-cell action-cell">
          <button id="add-trigger" type="button">Add Marker</button>
        </div>
      </div>
    </section>
    <section class="timecode-controls">
      <button id="wave-play" type="button">Play</button>
      <span id="wave-time">0.000s</span>
      <label>Zoom <input id="wave-zoom" type="range" min="1" max="48" step="0.5" value="1"></label>
    </section>
    <section class="timecode-wave">
      <canvas id="clip-wave"></canvas>
      <div id="wave-status" class="wave-status" role="status" aria-live="polite" hidden></div>
      <div id="wave-fade-in-zone" class="fade-zone in" hidden></div>
      <div id="wave-fade-out-zone" class="fade-zone out" hidden></div>
      <div id="wave-fade-in" class="fade-handle in"></div>
      <div id="wave-fade-out" class="fade-handle out"></div>
      <div id="wave-triggers"></div>
      <div class="wave-marker start" id="wave-start"></div>
      <div class="wave-marker end" id="wave-end"></div>
      <div class="wave-head" id="wave-head"></div>
    </section>
    <section class="panel">
      <h2>Markers</h2>
      <div id="trigger-list" class="trigger-list" tabindex="0"></div>
    </section>
  </dialog>

  <script type="module" src="scripts/cue-app.js"></script>
</body>

</html>
